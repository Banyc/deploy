[package]
name = "deploy"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tempfile = "3"
walkdir = "2"
unicode-normalization = "0.1"
libc = "0.2"
winnow = "1.0.4"
jiff = "0.2.35"

[dev-dependencies]
assert_fs = "1"
# The serialized real-process lifecycle target (`tests/process_lifecycle.rs`)
# probes pids with `kill(2)` / `waitpid(2)` directly (no external `kill`
# binary — the syscall-level probes the runner contract is about). `libc` is
# already a main dependency; this enables it for the integration tests.
libc = "0.2"
# Property-based state-machine coverage (src/semantic_invariants.rs): bounded
# RANDOM action vectors with shrinking instead of only the fixed sequences.
# Default features (fork/timeout) are unused; the test pins its own
# deterministic `ProptestConfig` (fixed seed + bounded cases).
proptest = "1"
# The sealed-writes compile-fail suite (tests/ui.rs + tests/ui/*.rs): proves
# a library caller CANNOT fabricate a Successful terminal (the sealed
# VerifiedExecution proof) or append outside a locked TargetLedgerTxn — the
# sealed API surface is enforced at COMPILE time, never by a runtime check.
trybuild = "1.0.120"
