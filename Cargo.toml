[package]
name = "deploy"
version = "0.1.0"
edition = "2024"

[features]
# THE REMOTE-FIXTURE API (`deploy::remote::helper::test_support`): the
# SANCTIONED public seam for building remote state in test fixtures — the
# crate's own integration tests and any external consumer that needs to
# build remote fixtures enable this feature to access it. The feature is
# OPT-IN: the production build (default features) deliberately does not
# enable it, so the ONLY public mutation path in a production build is
# `deploy::rollout::commit` with a `PreparedSlotMutation` (plus the
# capability acquisition `SlotRemote::acquire_lock_guard`). The fixture
# API is the documented exception for consumers who need it — see the
# module docs in `src/remote/helper/test_support.rs`.
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tempfile = "3"
walkdir = "2"
unicode-normalization = "0.1"
libc = "0.2"
winnow = "1.0.4"
jiff = "0.2.35"

[dev-dependencies]
assert_fs = "1"
# The crate as its OWN dev-dependency with the `test-support` feature: the
# integration tests (`tests/*.rs`) link THIS copy (with the fixture API),
# while `cargo build` and the lib target compile the crate WITHOUT the
# feature — the production build never carries the fixture API.
deploy = { path = ".", features = ["test-support"] }

# The serialized real-process lifecycle target (`tests/process_lifecycle.rs`)
# probes pids with `kill(2)` / `waitpid(2)` directly (no external `kill`
# binary — the syscall-level probes the runner contract is about). `libc` is
# already a main dependency; this enables it for the integration tests.
libc = "0.2"
# Property-based state-machine coverage (src/semantic_invariants.rs): bounded
# RANDOM action vectors with shrinking instead of only the fixed sequences.
# Default features (fork/timeout) are unused; the test pins its own
# deterministic `ProptestConfig` (fixed seed + bounded cases).
proptest = "1"
# The sealed-writes compile-fail suite (tests/ui.rs + tests/ui/*.rs): proves
# a library caller CANNOT fabricate a Successful terminal (the sealed
# VerifiedExecution proof) or append outside a locked TargetLedgerTxn — the
# sealed API surface is enforced at COMPILE time, never by a runtime check.
trybuild = "1.0.120"
