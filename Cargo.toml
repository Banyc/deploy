[package]
name = "deploy"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tempfile = "3"
walkdir = "2"
unicode-normalization = "0.1"
libc = "0.2"
winnow = "1.0.4"

[dev-dependencies]
assert_fs = "1"
# Property-based state-machine coverage (src/semantic_invariants.rs): bounded
# RANDOM action vectors with shrinking instead of only the fixed sequences.
# Default features (fork/timeout) are unused; the test pins its own
# deterministic `ProptestConfig` (fixed seed + bounded cases).
proptest = "1"
