[package]
name = "deploy"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tempfile = "3"
walkdir = "2"
unicode-normalization = "0.1"
libc = "0.2"

[dev-dependencies]
assert_fs = "1"
