schema_version = 1
application = "example"

# The active release. The project structure is forced: the release directory
# is `releases/<name>/`, and every `*.toml` file inside it is a variant
# (e.g. `standard`); artifact sources live beneath its `artifacts/` tree.
release = "v1"

# Servers are declared once; slots are declared inside the variant files and
# bind themselves to a target with their `target` field (a target's members
# are derived from the slots). Capacity is a per-server policy (shared by
# every deployment slot on the server), resolved from the caller's current
# configuration — never part of the release identity.
#
# An SSH address requires EXACTLY ONE host-identity source (trust-on-first-use
# is disabled): a dedicated `known_hosts` file, or a pre-verified
# `host_key_fingerprint`. The placeholder below must be replaced with the
# server's real SHA256 fingerprint (or swapped for `known_hosts =
# "/etc/ssh/known_hosts"`) before pushing over SSH.
[[servers]]
id = "server-01"            # durable ID; never rename it
address = "server-01.example.com"
user = "deploy"
host_key_fingerprint = "SHA256:quickstart-placeholder"
capacity = { reserve_bytes = 1073741824, reserve_percent = 0 }  # keep at least 1 GiB free

[[servers]]
id = "server-02"
address = "server-02.example.com"
user = "deploy"
host_key_fingerprint = "SHA256:quickstart-placeholder"
capacity = { reserve_bytes = 1073741824, reserve_percent = 0 }  # keep at least 1 GiB free

# Targets declare rollout + rotation policy only: their member slots are
# derived from the slots' `target` field (see releases/v1/standard.toml).
[targets.production]
rollout = { batch_size = 1, stop_on_failure = true, failure_policy = "rollback_changed" }

# Retention belongs to the target: how aggressively its servers rotate.
[targets.production.rotation.per_server]
keep_distinct_artifacts = 5   # keep the newest 5 distinct artifacts per server
keep_days = 14                # ...and everything activated in the last 14 days
protect_previous = true       # never delete the artifact `current` can roll back to

[targets.production.rotation.fleet]
protect_deployments = 2       # keep each server's artifacts of the newest 2 successful deployments
