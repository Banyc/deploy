# The `systemd` variant: ships a REAL systemd unit as its own artifact tree
# (strict mapping semantics: one file-tree destination per variant, so the
# `standard` variant's `app/` destination is not repeated here). The unit file
# is an artifact (`artifacts/systemd/example.service`) whose CONTENT is rendered per
# slot at activation time (`{{ deploy_dir }}` resolves to the slot's
# deploy_dir, `{{ user }}` to the per-server deployment account — the tree
# itself stays slot-independent); the rendered copy is
# installed into the user service manager (`~/.config/systemd/user/`),
# enabled, and restarted after `current` is swapped.
#
# It declares NO slots: to use it, add a [[slots]] entry (id, server,
# deploy_dir, target) like standard.toml's — the `target` field binds the
# slot to its ONE owning target.
#
# `standard.toml` documents every setting made live here, including the
# caveats: artifact-controlled unit files assume `scope = "user"`
# (systemctl --user), which holds no more authority than the deployment
# account; `scope = "system"` instead requires an admin-installed root-owned
# wrapper unit and never links artifact unit files into /etc/systemd/system.
description = "Systemd-managed deployment"

# STRICT MAPPING SEMANTICS: destinations must not overlap, so this variant
# maps only its own unit tree — the `standard` variant's `app/` destination
# is not repeated here. The unit file is an artifact
# (`artifacts/systemd/example.service`) whose CONTENT is rendered per slot at
# activation time; it lands at `app/example.service` in the release tree,
# matching `artifact_path` below.
[[artifact.mappings]]
from = "artifacts/systemd/"
to = "app/"
recursive = true

[activation]
adapter = "systemd"
scope = "user"                     # "user" (default) | "system"
reconcile_managed_units = true     # on success, disable and remove
                                   # formerly-managed links absent from the
                                   # new behavior contract

[[activation.units]]               # required: at least one unit
name = "example.service"           # unit name to enable and restart
artifact_path = "app/example.service"  # unit file inside the release tree
enable = true                      # systemctl enable (default)
restart = true                     # systemctl restart (default)

[verification]
adapter = "command"
argv = ["{{ deploy_dir }}/current/app/server", "health-check"]
timeout_seconds = 15
attempts = 3
interval_seconds = 2
